# Effects of the bhava lords: the lord of each house placed in each house.
#
# Primary: BPHS, G.C. Sharma translation, Vol.1, Chapter 26 ("Effects of the
# Bhava Lords"), verses 1-144. Cross-check: R. Santhanam translation, Vol.1,
# Chapter 24 (same title, same verse numbers). The two editions number the
# chapter differently; the verses line up one for one.
#
# `meaning` is a short paraphrase, not a quotation. Houses are whole-sign from
# the Lagna, as the engine reports them. Verses 145-148 add that a planet ruling
# two houses gives both results, that clashing results cancel, and that results
# scale with the lord's strength (full, half, quarter); strength is not applied
# here (it needs shadbala).

